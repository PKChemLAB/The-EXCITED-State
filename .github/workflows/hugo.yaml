name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main  

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 直接使用官方动作挂载 Hugo 环境（内部自带极致的缓存加速，秒级完成）
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.155.3' # 保持你原本指定的 0.155.3 版本
          extended: true          # 开启扩展版以支持编译高级 CSS 资产

      # 2. 拉取你的博客源码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 3. 编译静态页面（加上 --gc 参数自动清理过期缓存资产，提高效率）
      - name: Build with Hugo
        run: hugo --gc --minify

      # 4. 上传打包文件
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4