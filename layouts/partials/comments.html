<div class="comments">
    <div id="giscus-container"></div>
</div>

<script>
    // ========== 1. 精准匹配你的PaperMod主题检测 ==========
    function getGiscusTheme() {
        // 直接读取html标签的data-theme属性，和你的站点完全对应
        const pageTheme = document.documentElement.getAttribute('data-theme');
        console.log('[Giscus调试] 页面主题:', pageTheme);
        // 页面是dark就用深色主题，否则用浅色
        return pageTheme === 'dark' ? 'dark_dimmed' : 'light';
    }

    // ========== 2. 稳妥加载Giscus（不会清空容器，保证评论区必显示） ==========
    function loadGiscus() {
        const container = document.getElementById('giscus-container');
        if (!container) return;

        // 移除旧的脚本，避免重复加载，不碰容器其他内容
        const oldScript = container.querySelector('script[src*="giscus.app/client.js"]');
        if (oldScript) oldScript.remove();

        // 你的Giscus配置，完全保留你原来的参数
        const giscusConfig = {
            src: "https://giscus.app/client.js",
            "data-repo": "PKChemLAB/The-EXCITED-State",
            "data-repo-id": "R_kgDORQVY6g",
            "data-category": "Announcements",
            "data-category-id": "DIC_kwDORQVY6s4C2caC",
            "data-mapping": "pathname",
            "data-strict": "0",
            "data-reactions-enabled": "1",
            "data-emit-metadata": "0",
            "data-input-position": "bottom",
            "data-theme": getGiscusTheme(),
            "data-lang": "zh-CN",
            crossorigin: "anonymous",
            async: ""
        };

        // 创建并插入脚本
        const giscusScript = document.createElement("script");
        Object.entries(giscusConfig).forEach(([key, value]) => {
            giscusScript.setAttribute(key, value);
        });
        container.appendChild(giscusScript);
    }

    // ========== 3. 无刷新切换主题 ==========
    function syncGiscusTheme() {
        const newTheme = getGiscusTheme();
        const giscusIframe = document.querySelector('iframe.giscus-frame');
        
        if (giscusIframe) {
            // 给Giscus发消息切换主题，无刷新丝滑切换
            giscusIframe.contentWindow.postMessage({
                giscus: { setConfig: { theme: newTheme } }
            }, 'https://giscus.app');
            console.log('[Giscus调试] 已同步主题为:', newTheme);
        }
    }

    // ========== 4. 全方位监听主题切换（覆盖所有场景） ==========
    // 1. 监听主题切换按钮点击
    const themeToggleBtn = document.querySelector('#theme-toggle');
    if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', () => {
            // 延时200ms，等PaperMod先改完data-theme再同步
            setTimeout(syncGiscusTheme, 200);
        });
    }

    // 2. 监听html标签的data-theme属性变化（兜底，任何方式改主题都能捕捉）
    const themeObserver = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
            if (mutation.attributeName === 'data-theme') {
                syncGiscusTheme();
            }
        });
    });
    themeObserver.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme'] // 只监听data-theme属性，精准高效
    });

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', loadGiscus);
</script>
